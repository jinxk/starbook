name: starbook
description: "A homework sticker book for preschool children."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: 3.44.6

dependencies:
  archive: ^4.5.2
  audioplayers: ^6.8.1
  equatable: ^3.0.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.5
  fpdart: ^1.2.0
  go_router: ^18.0.2
  lottie: ^3.6.1
  riverpod_annotation: ^4.0.0
  share_plus: ^13.3.1
  sqflite: ^2.4.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.15.1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - packs/
    - assets/pictures/
    - assets/stickers/
    - assets/icons/
    - assets/licenses/
    - assets/sounds/
    - assets/voices/

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
    - family: Andika
      fonts:
        - asset: assets/fonts/Andika-Regular.ttf
        - asset: assets/fonts/Andika-Bold.ttf
          weight: 700
    - family: Hind
      fonts:
        - asset: assets/fonts/Hind-Regular.ttf
        - asset: assets/fonts/Hind-Medium.ttf
          weight: 500
